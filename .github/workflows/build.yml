name: Brume 3 OpenWrt bauen

on:
  push:
    branches: [main]
    paths: ['config/**', 'scripts/**', 'files/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch/Commit im GL.iNet-Repo (Standard: mt5000)"
        default: mt5000
        required: true
      all_kmods:
        description: "Alle Kernelmodule mitbauen (dauert länger, erlaubt spätere Nachinstallation)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/GLiNet-Tech/openwrt.git
  OPENWRT_PATH: /mnt/openwrt
  TZ: Europe/Berlin

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Build-Repo auschecken
        uses: actions/checkout@v4

      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / /mnt

      - name: Build-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-dev rsync swig unzip zlib1g-dev \
            file wget libelf-dev ccache zstd

      - name: Quellen klonen (GL.iNet mt5000 = OpenWrt main + PR #24237)
        run: |
          sudo mkdir -p "$OPENWRT_PATH"
          sudo chown "$USER:$USER" "$OPENWRT_PATH"
          git clone --filter=blob:none -b mt5000 "$SOURCE_REPO" "$OPENWRT_PATH"
          cd "$OPENWRT_PATH"
          git checkout "${{ inputs.source_ref || 'mt5000' }}"
          echo "SRC_REV=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          git log --oneline -3

      - name: Cache laden (Downloads & ccache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /mnt/openwrt/dl
            /mnt/openwrt/.ccache
          key: brume3-${{ env.SRC_REV }}-${{ hashFiles('config/brume3.config') }}
          restore-keys: brume3-

      - name: Quellbaum vorbereiten (inkl. copy_config-Fix)
        run: |
          cd "$OPENWRT_PATH"
          bash "$GITHUB_WORKSPACE/scripts/prepare.sh"
          # Eigene Dateien (Skripte, uci-defaults) ins Image übernehmen
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            mkdir -p files && cp -a "$GITHUB_WORKSPACE/files/." files/
            find files -type f | sed 's/^/  + /'
          fi

      - name: Feeds aktualisieren
        run: |
          cd "$OPENWRT_PATH"
          # Telefonie- und Video-Feed werden nicht gebraucht (spart Bauzeit,
          # rtpengine-kmod baut z. B. nicht mit Kernel 6.18)
          sed -i -E '/^src-git (telephony|video) /d' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Konfigurieren
        run: |
          cd "$OPENWRT_PATH"
          cp "$GITHUB_WORKSPACE/config/brume3.config" .config
          if [ "${{ inputs.all_kmods }}" != "false" ]; then
            echo "CONFIG_ALL_KMODS=y" >> .config
          fi
          echo "CONFIG_BUILD_LOG=y" >> .config
          make defconfig
          # Sicherstellen, dass nichts Wichtiges stillschweigend weggefallen ist
          for p in TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000 \
                   PACKAGE_luci PACKAGE_luci-proto-wireguard PACKAGE_luci-app-ddns \
                   PACKAGE_kmod-sched-cake PACKAGE_luci-app-sqm \
                   PACKAGE_nlbwmon PACKAGE_uhttpd-mod-ubus PACKAGE_mosquitto-client-nossl; do
            grep -q "^CONFIG_${p}=y" .config || { echo "FEHLER: $p fehlt nach defconfig"; exit 1; }
          done
          echo "Konfiguration OK"

      - name: Quellen herunterladen
        run: |
          cd "$OPENWRT_PATH"
          make -j$(nproc) download || make -j1 V=s download

      - name: Kompilieren
        run: |
          cd "$OPENWRT_PATH"
          # IGNORE_ERRORS="n m": ein kaputtes optionales Modul (m) bricht den Build
          # nicht ab; fest eingebaute Pakete (y) müssen weiterhin bauen.
          make -j$(nproc) IGNORE_ERRORS="n m" || make -j1 V=s IGNORE_ERRORS="n m"

      - name: Cache speichern (auch bei Fehler)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /mnt/openwrt/dl
            /mnt/openwrt/.ccache
          key: brume3-${{ env.SRC_REV }}-${{ hashFiles('config/brume3.config') }}-${{ github.run_id }}

      - name: Fehlerprotokolle in Branch build-logs sichern
        if: always()
        run: |
          cd "$OPENWRT_PATH"
          R="$RUNNER_TEMP/report"; mkdir -p "$R"
          {
            echo "Run ${{ github.run_id }} – Quelle ${SRC_REV:-?} – $(date -u)"
            echo
            echo "== Pakete mit Build-Fehlern =="
            grep -rlE 'make\[[0-9]+\]: \*\*\*' logs/package logs/target 2>/dev/null | sort || true
          } > "$R/zusammenfassung.txt"
          for f in $(grep -rlE 'make\[[0-9]+\]: \*\*\*' logs/package logs/target 2>/dev/null | head -40); do
            out="$R/$(echo "$f" | tr '/' '_')"
            tail -n 120 "$f" > "$out"
          done
          cd "$RUNNER_TEMP"
          rm -rf logrepo && git clone -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logrepo
          cd logrepo
          git checkout -q --orphan build-logs && git rm -rqf . || true
          cp "$R"/* .
          git add -A
          git -c user.name=build-bot -c user.email=build-bot@users.noreply.github.com \
            commit -qm "Build-Logs Run ${{ github.run_id }}" && git push -qf origin build-logs || true

      - name: Ergebnisse einsammeln
        if: always()
        run: |
          cd "$OPENWRT_PATH"
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          T=bin/targets/mediatek/filogic
          cp $T/*gl-mt5000*sysupgrade.bin $T/*gl-mt5000*factory.bin "$OUT/" 2>/dev/null || true
          cp $T/*.manifest $T/config.buildinfo $T/feeds.buildinfo $T/version.buildinfo "$OUT/" 2>/dev/null || true
          if [ -d "$T/packages" ]; then
            tar -C "$T" -czf "$OUT/kmods-und-target-pakete.tar.gz" packages
          fi
          (cd "$OUT" && sha256sum * > sha256sums.txt) || true
          ls -la "$OUT"
          echo "TAG=brume3-$(date +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brume3-firmware
          path: out/
          retention-days: 30

      - name: Release anlegen
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }} (Quelle ${{ env.SRC_REV }})
          prerelease: true
          body: |
            OpenWrt für GL.iNet GL-MT5000 (Brume 3)
            Quelle: GLiNet-Tech/openwrt @ ${{ env.SRC_REV }} (OpenWrt main + PR #24237)
            Zusatz: copy_config-Fix (Einstellungen behalten beim Sysupgrade)
            Alle kmods: ${{ inputs.all_kmods || 'true' }}
          files: out/*
